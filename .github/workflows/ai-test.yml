name: AI Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            Проанализируй этот репозиторий.

            1. Определи технологический стек.
            2. Опиши структуру проекта.
            3. Найди основные точки входа приложения.
            4. Найди существующие тесты.
            5. Предложи 3 небольших улучшения.

            Ничего не изменяй в файлах.
            В конце дай краткий отчет.